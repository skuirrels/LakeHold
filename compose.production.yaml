# Lakehold, production.
#
#   curl -O https://raw.githubusercontent.com/skuirrels/LakeHold/main/compose.production.yaml
#   docker compose -f compose.production.yaml up -d
#   → private workbench at http://localhost:8080/workbench
#
# This file is self-contained on purpose: it names published images, so it is the whole install. No
# clone, no .NET SDK, no Node, and no build on the host that is about to serve traffic. To run it
# from source instead — a contributor, or a deployment that patches something — add the build
# override, which supplies a build context for each image:
#
#   docker compose -f compose.production.yaml -f compose.build.yaml up -d --build
#
# This is a different thing from compose.yaml, which is the development stack: stock SDK images with
# the source bind-mounted and a file watcher. Nothing here mounts source, runs a watcher, or contains
# a compiler. The images hold published output and nothing else.
#
# Named compose.production.yaml to sit beside compose.yaml rather than replace it, because the
# development stack is the one people use daily and should keep the default filename.
#
# What this file deliberately does not include: PostgreSQL or an object store. PostgreSQL is required
# and supplied by the operator — managed, clustered, and backed up independently. Parquet may remain
# on the local volume for a deliberately single-node installation; S3, GCS, or Azure storage is the
# recommended multi-node configuration.

name: lakehold

services:
  api:
    image: ghcr.io/${LAKEHOLD_REGISTRY_NAMESPACE:-skuirrels}/lakehold-api:${LAKEHOLD_TAG:-latest}
    restart: unless-stopped

    # Not published. The browser reaches the API through the workbench's own origin, so the only way
    # in is the port below, and the API is not exposed to the host network at all. Publish
    # "${API_PORT:-5200}:5200" if a client outside the compose network needs it directly.
    expose:
      - "5200"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Lakehouse__StateRoot: /var/lib/lakehold
      # Empty still fails closed in Program.cs, with a direct error. The default keeps Compose
      # overlays able to replace these values without base-file interpolation failing first.
      ConnectionStrings__ControlPlane: ${LAKEHOLD_CONTROL_PLANE:-}
      ConnectionStrings__DuckLakeMetadata: ${LAKEHOLD_DUCKLAKE_METADATA:-}

      # The application default is false, so that a fresh checkout runs token-lessly and local
      # development stays frictionless. That default is wrong for anything with a published port:
      # without it the API trusts whatever tenant a URL names, and this stack publishes :8080. The
      # node mints a bootstrap token on first start and logs it once — see README.md — so turning it
      # on here costs one `docker compose logs` rather than a locked-out deployment.
      Lakehold__Auth__RequireAuthentication: ${LAKEHOLD_REQUIRE_AUTH:-true}
      Lakehold__BootstrapToken: ${LAKEHOLD_BOOTSTRAP_TOKEN:-}
      # Trust the proxy headers supplied by the colocated Workbench nginx so OIDC callback URLs use
      # the browser-facing scheme and host rather than the API container address.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      # Optional human sign-in. ClientId enables the browser authorization-code flow; the same
      # authority continues to validate bearer JWTs for API/MCP clients.
      Lakehold__Oidc__Authority: ${LAKEHOLD_OIDC_AUTHORITY:-}
      Lakehold__Oidc__Audience: ${LAKEHOLD_OIDC_AUDIENCE:-}
      Lakehold__Oidc__ClientId: ${LAKEHOLD_OIDC_CLIENT_ID:-}
      Lakehold__Oidc__ClientSecret: ${LAKEHOLD_OIDC_CLIENT_SECRET:-}
      Lakehold__Oidc__RequireHttpsMetadata: ${LAKEHOLD_OIDC_REQUIRE_HTTPS_METADATA:-true}
      Lakehold__Oidc__TenantClaim: ${LAKEHOLD_OIDC_TENANT_CLAIM:-tenant}
      Lakehold__Oidc__RoleClaim: ${LAKEHOLD_OIDC_ROLE_CLAIM:-role}
      Lakehold__Oidc__SystemAdminClaim: ${LAKEHOLD_OIDC_SYSTEM_ADMIN_CLAIM:-lakehold_admin}
      Lakehold__Oidc__SystemAdminValue: ${LAKEHOLD_OIDC_SYSTEM_ADMIN_VALUE:-true}

      # Telemetry goes wherever the deployment collects it. Unset means no exporter.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: lakehold-api

      # Secrets come from the environment, never from the image or this file. Compose reads .env for
      # substitution; a real deployment supplies them through its own secret store.
      Lakehouse__EjectSigningKey: ${LAKEHOLD_EJECT_SIGNING_KEY:-}
      Lakehold__PgWire__Enabled: ${LAKEHOLD_PGWIRE_ENABLED:-false}
      Lakehold__PgWire__Password: ${LAKEHOLD_PGWIRE_PASSWORD:-}
      # Browser imports use this volume only within one request. The API additionally enforces
      # aggregate reservations and retains a free-space floor before accepting bytes.
      Lakehold__CsvImport__ScratchRoot: /var/lib/lakehold-imports
      Lakehold__Querying__Planners__0__Id: csharp-linq
      Lakehold__Querying__Planners__0__Endpoint: http://linq-compiler:5210/
      Lakehold__Querying__Planners__0__SharedSecret: ${LAKEHOLD_LINQ_PLANNER_KEY:-}

    volumes:
      # Local Parquet (when selected), backups, and eject bundles. Control-plane and DuckLake
      # metadata are in PostgreSQL, never in this node-local volume.
      - lakehold-state:/var/lib/lakehold
      # Disposable and separately lifecycle-managed from durable lakehouse state.
      - lakehold-imports:/var/lib/lakehold-imports

    # A query is memory-hungry by design and DuckDB will use what it is given. Bounding the container
    # keeps one runaway statement from taking the host down with it; LakehouseOptions.MemoryLimit
    # should be set below this so DuckDB refuses before the kernel does.
    deploy:
      resources:
        limits:
          memory: ${LAKEHOLD_API_MEMORY:-4g}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - linq-internal

  # Optional and independently deployable. Enable with `docker compose -f
  # compose.production.yaml --profile linq up -d`; omit the profile to run the SQL-only product.
  linq-compiler:
    profiles: ["linq"]
    image: ghcr.io/${LAKEHOLD_REGISTRY_NAMESPACE:-skuirrels}/lakehold-linq-compiler:${LAKEHOLD_TAG:-latest}
    restart: unless-stopped
    expose:
      - "5210"
    environment:
      Lakehold__LinqCompiler__SharedSecret: ${LAKEHOLD_LINQ_PLANNER_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - linq-internal

  workbench:
    image: ghcr.io/${LAKEHOLD_REGISTRY_NAMESPACE:-skuirrels}/lakehold-web:${LAKEHOLD_TAG:-latest}
    restart: unless-stopped

    environment:
      # The standard installation serves the private workbench and its API proxy only. Public
      # marketing routes are enabled exclusively by compose.demo.yaml.
      LAKEHOLD_UI_MODE: workbench

    ports:
      - "${LAKEHOLD_PORT:-8080}:8080"

    depends_on:
      api:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lakehold-state:
  lakehold-imports:

networks:
  linq-internal:
    internal: true
