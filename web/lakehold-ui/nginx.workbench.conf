# Private production surface: the Workbench and its same-origin API proxy only.
#
# The Angular image also contains prerendered public pages because the demo uses the same artifact.
# They are deliberately unreachable here. Unknown and marketing routes return 404 instead of
# falling into Angular's wildcard route, which would otherwise render the landing page client-side.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    absolute_redirect off;

    location = / {
        return 302 /workbench;
    }

    location = /workbench {
        try_files /index.csr.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /workbench/ {
        return 308 /workbench;
    }

    # Prevent a caller from bypassing the route policy by requesting the client shell directly.
    location = /index.csr.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        client_max_body_size 5g;
        proxy_pass         http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Browser OIDC starts here and returns through /auth/callback. Keep the public host/protocol so
    # the API constructs the same redirect URI registered at the identity provider.
    location ^~ /auth/ {
        proxy_pass         http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    location = /mcp {
        proxy_pass         http://api:5200/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # Prefix, not an exact match: RFC 9728 puts the metadata for a resource with a path at
    # `/.well-known/oauth-protected-resource/<path>`, and that is the form a client asks for first.
    # Unlike the website configuration this one already answers unknown paths with 404 rather than
    # the SPA shell, so the suffixed form failed quietly rather than returning HTML — but it still
    # meant the first request of every MCP login missed.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass       http://api:5200;
        proxy_set_header Host $http_host;
    }

    # Authorization-server discovery, which the API answers with a redirect to the real issuer. A
    # client that will not follow `authorization_servers` cross-origin looks for these here, and
    # `location /` below returns 404 for anything unmatched — which is exactly the answer that makes
    # such a client fall back to assuming this host is its own authorization server. Proxied by
    # prefix so the path-suffixed forms reach the API too.
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass       http://api:5200;
        proxy_set_header Host $http_host;
    }

    location ^~ /.well-known/openid-configuration {
        proxy_pass       http://api:5200;
        proxy_set_header Host $http_host;
    }

    location = /health {
        proxy_pass http://api:5200/health;
    }

    # Workbench bundles and branding assets are fingerprinted and immutable. No HTML route is
    # matched by this allow-list.
    location ~* \.(js|css|woff2?|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 404;
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
