# Private production surface: the Workbench and its same-origin API proxy only.
#
# The Angular image also contains prerendered public pages because the demo uses the same artifact.
# They are deliberately unreachable here. Unknown and marketing routes return 404 instead of
# falling into Angular's wildcard route, which would otherwise render the landing page client-side.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    absolute_redirect off;

    location = / {
        return 302 /workbench;
    }

    location = /workbench {
        try_files /index.csr.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /workbench/ {
        return 308 /workbench;
    }

    # Prevent a caller from bypassing the route policy by requesting the client shell directly.
    location = /index.csr.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass         http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location = /health {
        proxy_pass http://api:5200/health;
    }

    # Workbench bundles and branding assets are fingerprinted and immutable. No HTML route is
    # matched by this allow-list.
    location ~* \.(js|css|woff2?|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 404;
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
