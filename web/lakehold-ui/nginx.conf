# Serves the built Angular bundle and proxies the API on the same origin.
#
# Same-origin is the point: it removes CORS from the production deployment entirely, and it means the
# browser only ever needs one published port. The API container does not have to be reachable from
# outside the compose network at all.

# www.lakehold.dev is a CNAME to this server, and DNS gives both names to the same listener. Send
# it to the bare apex rather than serving it a second time, matching the <link rel="canonical">
# tags the marketing pages already emit for https://lakehold.dev.
server {
    listen       8080;
    server_name  www.lakehold.dev;
    return       301 https://lakehold.dev$request_uri;
}

server {
    listen       8080 default_server;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Never build an absolute redirect. nginx would compose one from `listen` and `server_name`,
    # which behind TLS termination means redirecting https://lakehold.dev/docs to
    # http://lakehold.dev:8080/docs/ — downgrading the scheme and publishing the internal port. A
    # relative Location keeps whatever scheme, host, and port the client actually used.
    absolute_redirect off;

    # Runtime-only analytics configuration. The private Workbench nginx configuration does not
    # expose this endpoint, and the Angular app requests it only after a public-page navigation.
    location = /analytics-config.json {
        alias /tmp/lakehold-analytics.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Angular owns the routes. The public product and documentation routes are prerendered to their
    # own index.html and served directly by the first try_files clauses. Everything else — the
    # client-rendered workbench and any unknown path the router resolves in-app — falls back to the
    # client shell, never to a prerendered page, whose hydrated markup would not match the route.
    #
    # `$uri/index.html` comes before `$uri/`, and that ordering is the whole point: `$uri/` matches
    # the prerendered directory and makes nginx 301 to the trailing-slash form, so /docs answered a
    # redirect while every page's own rel="canonical" named /docs. Google resolves a canonical that
    # redirects by picking some other URL as canonical, which is how the marketing pages end up
    # indexed under a URL nobody chose. Serving the directory's index.html directly returns 200 at
    # the canonical URL, and the two signals finally agree.
    location / {
        try_files $uri $uri/index.html $uri/ /index.csr.html;
    }

    location /api/ {
        client_max_body_size 5g;
        proxy_pass         http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_send_timeout 300s;

        # Query results stream and a large one legitimately takes minutes; the default 60s would cut
        # a working query off at the proxy and report it to the user as a server error.
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location ^~ /auth/ {
        proxy_pass         http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # MCP is a long-lived Streamable HTTP exchange, not an Angular route. Keep response buffering off
    # so protocol events reach the client as the API emits them.
    location = /mcp {
        proxy_pass         http://api:5200/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # Prefix, not an exact match. RFC 9728 has a client look for the metadata of a resource with a
    # path at `/.well-known/oauth-protected-resource/<path>` — `/…/mcp` here — and that is the form
    # it tries first. Matched exactly, only the bare document was proxied and the suffixed one fell
    # through to the SPA below, which answers unknown paths with `index.csr.html`. The client asked
    # for JSON, got HTML, and failed on `Unrecognized token '<'`.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass       http://api:5200;
        proxy_set_header Host $host;
    }

    # LakeHold is a resource server, not an authorization server, and has to be unmistakable about
    # it. When a client cannot discover authorization-server metadata it falls back to the older MCP
    # assumption that the MCP server is its own authorization server, and probes these three paths on
    # this origin. Under the SPA fallback they answered 200 HTML, which reads as "present" — so the
    # client committed to the fallback and sent people to https://<this-host>/authorize, which does
    # not exist. A 404 is the honest answer and is what makes the client read `authorization_servers`
    # out of the document above instead.
    location = /authorize { return 404; }
    location = /token     { return 404; }
    location = /register  { return 404; }

    location /health {
        proxy_pass http://api:5200/health;
    }

    # Fingerprinted build output is immutable; index.html must never be, or a deploy is invisible
    # until every client clears its cache.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Every HTML entry point — the prerendered marketing pages and the client shell alike —
    # references fingerprinted bundles and must never be cached, or a deploy is invisible until
    # each client clears its cache.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
