<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LakeHold — a feature-rich DuckDB lakehouse you host yourself</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Bing Webmaster Tools site verification. Ownership proof, not a secret: it says only that whoever
    controls this page also controls the Bing property. Removing it un-verifies the site, so it stays
    even though verification has already succeeded.
  -->
  <meta name="msvalidate.01" content="46DB0BCE96C88E5BA425E4C89C5ABB8D" />
  <!--
    ICO first, SVG second. A browser that understands SVG icons takes the later, more specific
    declaration; one that does not ignores it and falls back to the ICO. Declaring them the other
    way round leaves legacy browsers (Safari before 16.4) on the raster copy anyway but costs
    modern ones a needless request.
  -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffc857">

  <!--
    The palette, applied before the first paint.
    Every page here is prerendered dark, because the server has no way to know what this visitor
    chose. `ThemeService` would put that right, but only once the bundle has parsed and booted —
    long enough for a visitor on the light theme to be shown a full dark page first. Reading the one
    key it owns synchronously in the head closes that window; the service remains the only writer.
    Absent, wrong, or unreadable storage all leave the document on the dark default already in
    `styles.css`, so this can only ever move a page towards what was asked for.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('lakehold.theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {
        /* Storage denied (Safari private browsing throws on access): the default is correct. */
      }
    })();
  </script>

  <!--
    Per-route description, canonical, Open Graph, and JSON-LD tags are written by `SeoService` and
    baked into each prerendered page. What stays here is only what is true of every page.

    The site-wide `SoftwareApplication` block that used to live here has moved there deliberately:
    repeated verbatim on every page, it told a crawler that the documentation describes the product
    just as directly as the home page does, and left nothing to prefer the home page with. The home
    page now carries the product entity and every other page an article that points back at it.
  -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
