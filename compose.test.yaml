# Disposable services used only by `make test`.
#
# Combined with compose.production.yaml and compose.build.yaml, this adds real PostgreSQL and
# S3-compatible integrations to a seeded test node. Authentication is required here exactly as it is
# in production -- a test stack that authenticates differently from the thing it is testing proves
# nothing about the thing it is testing.
# scripts/test-all.sh gives the stack its own project name, host ports, and volumes, then removes all
# of them on exit. Nothing here shares state with the development or production deployment.

services:
  api:
    environment:
      Lakehold__SeedDemoData: "true"
      # A deliberately public test credential, valid only inside this disposable state volume. The
      # browser suites exchange it for a tenant owner token; see web/lakehold-ui/e2e/credential.ts.
      Lakehold__BootstrapToken: "lkh_admin_e2ebootstrapcredential00000000000000000000"
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold
      ConnectionStrings__DuckLakeMetadata: Host=postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold
      Lakehold__Querying__Planners__0__SharedSecret: lakehold-test-linq-planner
      # The private browser suite exercises human sign-in too. The issuer is the browser-facing
      # address embedded in tokens; discovery and provisioning use the Compose-network address.
      Lakehold__Oidc__Authority: http://localhost:${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}/realms/lakehold
      Lakehold__Oidc__MetadataAddress: http://keycloak:${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}/realms/lakehold/.well-known/openid-configuration
      Lakehold__Oidc__Audience: lakehold-workbench
      Lakehold__Oidc__ClientId: lakehold-workbench
      Lakehold__Oidc__McpClientId: lakehold-mcp
      Lakehold__Oidc__ClientSecret: lakehold-development-client-secret
      Lakehold__Oidc__RequireHttpsMetadata: "false"
      Lakehold__Oidc__Mode: BuiltIn
      Lakehold__Oidc__Provisioning__AdminBaseUrl: http://keycloak:${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}
      Lakehold__Oidc__Provisioning__Realm: lakehold
      Lakehold__Oidc__Provisioning__ClientId: lakehold-provisioner
      Lakehold__Oidc__Provisioning__ClientSecret: lakehold-provisioner-development-secret
      Lakehold__Oidc__TenantClaim: tenant
      Lakehold__Oidc__RoleClaim: role
      Lakehold__Oidc__SystemAdminClaim: groups
      Lakehold__Oidc__SystemAdminValue: lakehold-administrators
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  linq-compiler:
    environment:
      Lakehold__LinqCompiler__SharedSecret: lakehold-test-linq-planner

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}"
    ports:
      - "${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}:${LAKEHOLD_TEST_KEYCLOAK_PORT:-6401}"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lakehold
      POSTGRES_PASSWORD: lakehold
      POSTGRES_DB: lakeholdmeta
    ports:
      - "${LAKEHOLD_TEST_POSTGRES_PORT:-56439}:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehold -d lakeholdmeta"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakehold
      MINIO_ROOT_PASSWORD: lakehold123
    ports:
      - "${LAKEHOLD_TEST_MINIO_PORT:-60000}:9000"
      - "${LAKEHOLD_TEST_MINIO_CONSOLE_PORT:-60001}:9001"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 lakehold lakehold123 &&
        mc mb --ignore-existing local/lakehold-test

volumes:
  test-postgres-data:
  test-minio-data:
