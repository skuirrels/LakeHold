# Disposable services used only by `make test`.
#
# Combined with compose.production.yaml and compose.build.yaml, this adds real PostgreSQL and
# S3-compatible integrations while making the application a seeded, authentication-free test node.
# scripts/test-all.sh gives the stack its own project name, host ports, and volumes, then removes all
# of them on exit. Nothing here shares state with the development or production deployment.

services:
  api:
    environment:
      Lakehold__SeedDemoData: "true"
      Lakehold__Auth__RequireAuthentication: "false"
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold
      ConnectionStrings__DuckLakeMetadata: Host=postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold
      Lakehold__Querying__Planners__0__SharedSecret: lakehold-test-linq-planner
    depends_on:
      postgres:
        condition: service_healthy

  linq-compiler:
    environment:
      Lakehold__LinqCompiler__SharedSecret: lakehold-test-linq-planner

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lakehold
      POSTGRES_PASSWORD: lakehold
      POSTGRES_DB: lakeholdmeta
    ports:
      - "${LAKEHOLD_TEST_POSTGRES_PORT:-56439}:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehold -d lakeholdmeta"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakehold
      MINIO_ROOT_PASSWORD: lakehold123
    ports:
      - "${LAKEHOLD_TEST_MINIO_PORT:-60000}:9000"
      - "${LAKEHOLD_TEST_MINIO_CONSOLE_PORT:-60001}:9001"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 lakehold lakehold123 &&
        mc mb --ignore-existing local/lakehold-test

volumes:
  test-postgres-data:
  test-minio-data:
