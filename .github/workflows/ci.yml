# Build and test on every push and pull request.
#
# This exists so the images published by release.yml are built from a commit that was known to
# compile and pass its tests. Publishing an artifact nobody had built in a clean checkout is worse
# than publishing none: it moves the failure from a contributor's machine to an operator's node.
#
# The fast backend job needs no services. A separate integration job opts into PostgreSQL and MinIO
# explicitly, so a green pull request means both the isolated suite and the real storage contracts
# ran. Browser tests use the complete Compose stack and exercise the product through Chromium.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Lakehold.slnx

      - name: Build
        run: dotnet build Lakehold.slnx --no-restore

      - name: Test
        run: dotnet test Lakehold.slnx --no-build

  frontend:
    name: Build and unit test the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/lakehold-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/lakehold-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  public-api-sdks:
    name: Verify the public API and SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Verify the frozen OpenAPI contract
        run: ./scripts/verify-openapi.sh

      - name: Reject breaking OpenAPI changes
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: |
          python scripts/test-openapi-compatibility.py
          python scripts/check-openapi-compatibility.py --base-ref "$OPENAPI_BASE_REF"

      - name: Prove generated clients are reproducible
        run: |
          ./scripts/generate-sdks.sh
          git diff --exit-code -- sdk
          test -z "$(git ls-files --others --exclude-standard -- sdk)"

      - name: Test Java SDK
        working-directory: sdk/java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test ./...

      - name: Test .NET SDK
        working-directory: sdk/dotnet
        run: dotnet test Lakehold.Sdk.sln

      - name: Install Python SDK and test dependency
        working-directory: sdk/python
        run: python -m pip install . pytest

      - name: Test Python SDK
        working-directory: sdk/python
        run: python -m pytest -q

      - name: Compile Java example
        run: |
          mvn --batch-mode --no-transfer-progress -f sdk/java/pom.xml install -DskipTests
          mvn --batch-mode --no-transfer-progress -f sdk/examples/java/pom.xml compile

      - name: Compile Go example
        working-directory: sdk/examples/go
        run: go test ./...

      - name: Compile .NET example
        working-directory: sdk/examples/dotnet
        run: dotnet build Lakehold.Example.csproj

      - name: Compile Python example
        run: python -m py_compile sdk/examples/python/stream_query.py

  backend-integration:
    name: Test PostgreSQL and S3 integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Configure local test services
        run: cp .env.example .env

      - name: Start PostgreSQL and MinIO
        run: |
          docker compose up -d postgres minio
          docker compose up minio-bucket

      - name: Run engine tests with every integration enabled
        run: |
          dotnet test tests/Lakehold.Engine.Tests/Lakehold.Engine.Tests.csproj \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory artifacts/test-results
          if grep -q 'outcome="NotExecuted"' artifacts/test-results/integration.trx; then
            echo "An opted-in integration test was skipped."
            exit 1
          fi

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color postgres minio minio-bucket

      - name: Stop test services
        if: always()
        run: docker compose down -v

  e2e:
    name: Test real user journeys in Chromium
    runs-on: ubuntu-latest
    env:
      # Shared by the stack (which adopts it as the instance credential) and the suites (which
      # exchange it for a tenant owner token). Disposable, and scoped to this runner.
      LAKEHOLD_E2E_BOOTSTRAP_TOKEN: lkh_admin_e2ebootstrapcredential00000000000000000000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/lakehold-ui/package-lock.json

      - name: Install browser test dependencies
        working-directory: web/lakehold-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure the development stack
        # The journeys authenticate, because the stack they run against does. A known bootstrap
        # credential makes that deterministic; it is disposable and never leaves this runner.
        run: |
          cp .env.example .env
          echo "LAKEHOLD_BOOTSTRAP_TOKEN=$LAKEHOLD_E2E_BOOTSTRAP_TOKEN" >> .env

      - name: Start Lakehold
        run: |
          docker compose --profile linq up -d
          timeout 240 bash -c 'until curl -fsS http://localhost:5399/workbench >/dev/null; do sleep 3; done'

      - name: Run browser journeys
        working-directory: web/lakehold-ui
        run: npm run test:e2e

      - name: Upload browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lakehold-playwright-evidence
          path: output/playwright/
          if-no-files-found: ignore

      - name: Show stack logs after a failure
        if: failure()
        run: docker compose logs --no-color api ui linq-compiler

      - name: Stop Lakehold
        if: always()
        run: docker compose down -v

  phase2:
    name: Simulate a disposable production operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/lakehold-ui/package-lock.json

      - name: Install browser test dependencies
        working-directory: web/lakehold-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure the disposable stack
        run: cp .env.example .env

      - name: Run the destructive full-system simulation
        run: npm run test:e2e:phase2 --prefix web/lakehold-ui

      - name: Upload operator evidence after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lakehold-phase2-playwright-evidence
          path: output/playwright/
          if-no-files-found: ignore
