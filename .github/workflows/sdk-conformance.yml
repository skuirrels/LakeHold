name: Released server SDK conformance

on:
  workflow_dispatch:
    inputs:
      server_image_tag:
        description: Immutable released GHCR image tag without a v prefix
        required: true
        default: 1.4.0
        type: string
  # Manual-only evidence goes stale silently: nothing re-runs it when the server changes, so a
  # green result records a past image rather than a standing guarantee. The weekly run keeps the
  # roadmap's released-image conformance claim honest between releases.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: read

env:
  # A scheduled run carries no inputs, so the tag falls back to the current released line.
  RESOLVED_SERVER_IMAGE_TAG: ${{ inputs.server_image_tag || '1.4.0' }}

concurrency:
  group: sdk-conformance-${{ inputs.server_image_tag || '1.4.0' }}
  cancel-in-progress: false

jobs:
  conformance:
    name: ${{ matrix.sdk }} released-image conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [java, go, dotnet, python]
    env:
      LAKEHOLD_CONFORMANCE_TENANT: sdk-conformance
      LAKEHOLD_CONFORMANCE_CATALOG: sdk_release
    steps:
      - uses: actions/checkout@v7

      - name: Start an isolated released server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_IMAGE_TAG: ${{ env.RESOLVED_SERVER_IMAGE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          registry_owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          server_image="ghcr.io/$registry_owner/lakehold-api:$SERVER_IMAGE_TAG"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$server_image"
          docker network create lakehold-sdk-conformance
          docker run --detach --name lakehold-sdk-postgres \
            --network lakehold-sdk-conformance \
            --env POSTGRES_USER=lakehold \
            --env POSTGRES_PASSWORD=lakehold \
            --env POSTGRES_DB=lakeholdmeta \
            postgres:17-alpine
          for attempt in {1..60}; do
            if docker exec lakehold-sdk-postgres pg_isready -U lakehold -d lakeholdmeta >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs lakehold-sdk-postgres
              exit 1
            fi
            sleep 1
          done
          bootstrap_token="lkh_admin_$(openssl rand -hex 32)"
          echo "::add-mask::$bootstrap_token"
          docker run --detach --name lakehold-sdk-api \
            --network lakehold-sdk-conformance \
            --publish 127.0.0.1:5200:5200 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Lakehouse__StateRoot=/var/lib/lakehold \
            --env 'ConnectionStrings__ControlPlane=Host=lakehold-sdk-postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold' \
            --env 'ConnectionStrings__DuckLakeMetadata=Host=lakehold-sdk-postgres;Port=5432;Database=lakeholdmeta;Username=lakehold;Password=lakehold' \
            --env Lakehold__Auth__RequireAuthentication=true \
            --env Lakehold__BootstrapToken="$bootstrap_token" \
            "$server_image"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:5200/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 90 ]]; then
              docker logs lakehold-sdk-api
              exit 1
            fi
            sleep 1
          done
          api_origin=http://127.0.0.1:5200
          curl --fail --silent --show-error -X POST "$api_origin/api/tenants" \
            -H "Authorization: Bearer $bootstrap_token" \
            -H 'Content-Type: application/json' \
            -d '{"slug":"sdk-conformance","displayName":"SDK Conformance"}' \
            -o /dev/null
          curl --fail --silent --show-error -X POST "$api_origin/api/tenants/sdk-conformance/catalogs" \
            -H "Authorization: Bearer $bootstrap_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"sdk_release"}' \
            -o /dev/null
          token_response=$(curl --fail --silent --show-error -X POST \
            "$api_origin/api/tenants/sdk-conformance/tokens" \
            -H "Authorization: Bearer $bootstrap_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"released-sdk-conformance","role":"reader","catalogName":"sdk_release"}')
          conformance_token=$(jq -er '.token' <<<"$token_response")
          echo "::add-mask::$conformance_token"
          {
            echo 'LAKEHOLD_CONFORMANCE_URL=http://127.0.0.1:5200'
            echo "LAKEHOLD_CONFORMANCE_TOKEN=$conformance_token"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: matrix.sdk == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - name: Test Java SDK
        if: matrix.sdk == 'java'
        working-directory: sdk/java
        run: mvn --batch-mode --no-transfer-progress test

      - uses: actions/setup-go@v7
        if: matrix.sdk == 'go'
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Test Go SDK
        if: matrix.sdk == 'go'
        working-directory: sdk/go
        run: go test ./...

      - uses: actions/setup-dotnet@v6
        if: matrix.sdk == 'dotnet'
        with:
          dotnet-version: "8.0.x"
      - name: Test .NET SDK
        if: matrix.sdk == 'dotnet'
        working-directory: sdk/dotnet
        run: dotnet test Lakehold.Sdk.sln

      - uses: actions/setup-python@v7
        if: matrix.sdk == 'python'
        with:
          python-version: "3.13"
      - name: Test Python SDK
        if: matrix.sdk == 'python'
        working-directory: sdk/python
        run: |
          python -m pip install . pytest
          python -m pytest -q

      - name: Stop the isolated server
        if: always()
        shell: bash
        run: |
          docker rm --force lakehold-sdk-api lakehold-sdk-postgres 2>/dev/null || true
          docker network rm lakehold-sdk-conformance 2>/dev/null || true
