# The whole Lakehold development stack.
#
#   docker compose up          # start everything
#   docker compose down -v     # stop and discard the data
#
#   Workbench       http://localhost:5399     <- the website
#   API             http://localhost:5200
#   Traces          http://localhost:16686
#   MinIO console   http://localhost:59001
#
# The api development image adds LakeHold's signed DuckDB extensions to the stock SDK while the
# source remains bind-mounted, so `dotnet watch` and `ng serve` still hot-reload on save. Slower to
# start than running them on the host; the trade is that `docker compose up` is the single command
# that gives you a working product without downloading extensions at application runtime.
#
# To run those two on the host instead — a faster inner loop — start only the backing services:
#
#   docker compose up -d postgres minio minio-bucket jaeger
#   dotnet run --project src/Lakehold.Api
#   npm start --prefix web/lakehold-ui
#
# PostgreSQL and MinIO are also what the gated integration suites need; `dotnet test` skips them when
# they are not up. Ports are deliberately non-default (55439, 59000) so nothing collides with a
# PostgreSQL or MinIO you already run locally.
#
# Ports, users, and database names are written here with inline defaults rather than pulled from
# .env: they are configuration, not secrets, and belong in source control where everyone gets the
# same values. Only the passwords are substituted from .env, which compose reads automatically. The
# ${VAR:-default} form keeps every one of them overridable without editing this file.

name: lakehold-dev

services:
  # The API. Runs `dotnet watch` against the bind-mounted source, so a save rebuilds in place.
  api:
    build:
      context: .
      dockerfile: src/Lakehold.Api/Dockerfile
      target: development
    container_name: lakehold-api
    working_dir: /src
    command: dotnet watch run --project src/Lakehold.Api --non-interactive --no-launch-profile
    environment:
      # 0.0.0.0, not localhost: a server bound to loopback inside a container is unreachable through
      # the published port, and presents as a refused connection rather than an error.
      ASPNETCORE_URLS: http://0.0.0.0:5200
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # Container-internal hostnames. The appsettings values point at localhost, which in here would
      # mean this container rather than the collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: lakehold-api
      # Bootstrap default for a fresh development database. Once System Settings is saved, its
      # shared PostgreSQL row wins and changes apply without restarting this container.
      Lakehold__Mcp__Enabled: "true"
      Lakehold__BootstrapToken: ${LAKEHOLD_BOOTSTRAP_TOKEN:-}
      # Development points at the bundled Keycloak by default, so browser sign-in is exercised by
      # whoever runs the stack rather than being the one surface nobody tries. Every value is still
      # an override: point them at your own provider, or clear the authority to turn OIDC off and
      # fall back to API tokens. See deploy/keycloak/README.md.
      #
      # The browser reaches Keycloak on a published port; the API reaches it over the compose
      # network. The issuer is baked into every token and must stay the name the browser used, so
      # the authority is the published one and metadata is fetched from the internal name instead.
      Lakehold__Oidc__Authority: ${LAKEHOLD_OIDC_AUTHORITY:-http://localhost:${KEYCLOAK_PORT:-5401}/realms/lakehold}
      Lakehold__Oidc__MetadataAddress: ${LAKEHOLD_OIDC_METADATA_ADDRESS:-http://keycloak:${KEYCLOAK_PORT:-5401}/realms/lakehold/.well-known/openid-configuration}
      Lakehold__Oidc__Audience: ${LAKEHOLD_OIDC_AUDIENCE:-lakehold-workbench}
      Lakehold__Oidc__ClientId: ${LAKEHOLD_OIDC_CLIENT_ID:-lakehold-workbench}
      Lakehold__Oidc__McpClientId: ${LAKEHOLD_OIDC_MCP_CLIENT_ID:-lakehold-mcp}
      Lakehold__Oidc__ClientSecret: ${LAKEHOLD_OIDC_CLIENT_SECRET:-lakehold-development-client-secret}
      Lakehold__Oidc__RequireHttpsMetadata: ${LAKEHOLD_OIDC_REQUIRE_HTTPS_METADATA:-false}
      Lakehold__Oidc__TenantClaim: ${LAKEHOLD_OIDC_TENANT_CLAIM:-tenant}
      Lakehold__Oidc__RoleClaim: ${LAKEHOLD_OIDC_ROLE_CLAIM:-role}
      Lakehold__Oidc__SystemAdminClaim: ${LAKEHOLD_OIDC_SYSTEM_ADMIN_CLAIM:-groups}
      Lakehold__Oidc__SystemAdminValue: ${LAKEHOLD_OIDC_SYSTEM_ADMIN_VALUE:-lakehold-administrators}
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lakeholdmeta};Username=${POSTGRES_USER:-lakehold};Password=${POSTGRES_PASSWORD:-lakehold}
      ConnectionStrings__DuckLakeMetadata: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lakeholdmeta};Username=${POSTGRES_USER:-lakehold};Password=${POSTGRES_PASSWORD:-lakehold}
      Lakehold__Querying__Planners__0__Id: csharp-linq
      Lakehold__Querying__Planners__0__Endpoint: http://linq-compiler:5210/
      Lakehold__Querying__Planners__0__SharedSecret: ${LAKEHOLD_LINQ_PLANNER_KEY:-local-linq-planner}
    ports:
      - "${API_PORT:-5200}:5200"
    volumes:
      - .:/src
      # Named volumes keep build output, the NuGet cache, and lakehouse state out of the bind mount,
      # so the container never fights the host's own obj/bin (different RIDs), restore is not
      # repeated on every start.
      - nuget-cache:/root/.nuget/packages
      - api-state:/src/src/Lakehold.Api/.lakehold
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - default
      - linq-internal
    healthcheck:
      # /health, not /api/tenants. A data route answers 401 to the credential-less probe, so
      # probing one made the container unhealthy for the correct reason and stopped the UI, which
      # waits on service_healthy, from starting at all. Health has to mean "the process is
      # serving", not "this request was authorised".
      test: ["CMD-SHELL", "curl -fsS http://localhost:5200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Opt-in planner: `docker compose --profile linq up`. With the profile absent the API simply
  # omits C# LINQ from discovery, while SQL and every other Workbench surface remain available.
  linq-compiler:
    profiles: ["linq"]
    build:
      context: .
      dockerfile: src/Lakehold.Linq.Compiler/Dockerfile
    container_name: lakehold-linq-compiler
    environment:
      Lakehold__LinqCompiler__SharedSecret: ${LAKEHOLD_LINQ_PLANNER_KEY:-local-linq-planner}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    networks:
      - linq-internal

  # Development identity provider, on by default.
  #
  # Browser sign-in is the path real deployments use for people, and while it was optional here it
  # was the one surface nobody exercised. Running it by default means a broken login is a broken
  # `docker compose up`, not a support question months later. The realm, its client, its claim
  # mappers, and two seeded users are imported from deploy/keycloak — see the README there for how
  # to grant either user the other capability, or to point LakeHold at your own provider instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: lakehold-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixes the issuer Keycloak advertises. Without it the value follows whichever host header
      # arrived, so a token minted through the browser would carry an issuer the API rejects.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-5401}
      # Front-channel URLs (where the browser is sent) use the fixed hostname above; back-channel
      # URLs follow the request, so the API's token exchange goes to `keycloak:5401` rather than to
      # a localhost that, inside its own container, is the API.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Listens on the published port rather than 8080, so `keycloak.localhost:5401` means the same
      # thing from the host and from inside the network. The issuer is one string in every token; if
      # the port differed by vantage point, the API could not fetch discovery for the issuer it is
      # required to validate.
      KC_HTTP_PORT: "${KEYCLOAK_PORT:-5401}"
    ports:
      - "${KEYCLOAK_PORT:-5401}:${KEYCLOAK_PORT:-5401}"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  # The Angular dev server — this is the website.
  ui:
    image: node:24-alpine
    container_name: lakehold-ui
    working_dir: /app
    # node_modules is a named volume so the host's macOS-built native binaries never shadow the
    # Linux ones; npm ci installs into the container's own tree.
    command: sh -c "npm ci --no-audit --no-fund && npm start -- --host 0.0.0.0 --port 5399 --poll 2000"
    environment:
      # Read by proxy.conf.mjs. Nothing sets this on the host, so there it falls back to localhost.
      NG_API_URL: http://api:5200
    ports:
      - "${UI_PORT:-5399}:5399"
    volumes:
      - ./web/lakehold-ui:/app
      # Operational pages import the repository Markdown directly so the website and runbooks cannot
      # drift. Preserve that same absolute path inside the container as the production image build.
      - ./docs:/docs:ro
      - ui-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Shared control plane and DuckLake metadata catalog. Development uses one database with isolated
  # DuckLake schemas; production may assign separate databases/users for least privilege.
  postgres:
    image: postgres:17-alpine
    container_name: lakehold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehold}
      POSTGRES_DB: ${POSTGRES_DB:-lakeholdmeta}
    ports:
      - "${POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports the socket is accepting connections, which is what the tests wait on.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehold} -d ${POSTGRES_DB:-lakeholdmeta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bring-your-own-bucket is the product's headline claim, so the backup and eject paths are tested
  # against a real S3 API rather than a local directory. Object stores differ in ways the type system
  # hides: no directories to enumerate, no delete, and paths that are not Path-shaped.
  minio:
    image: minio/minio:latest
    container_name: lakehold-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehold}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehold123}
    ports:
      - "${MINIO_PORT:-59000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-59001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the test bucket. This is not optional convenience: ObjectStoreBackupTests writes to
  # s3://<bucket>/… and never creates the bucket itself, so without this the S3 tests fail against a
  # running MinIO rather than skipping cleanly — the most confusing of the three possible outcomes.
  minio-bucket:
    image: minio/mc:latest
    container_name: lakehold-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-lakehold}' '${MINIO_ROOT_PASSWORD:-lakehold123}' &&
      mc mb --ignore-existing local/'${LAKEHOLD_TEST_S3_BUCKET:-lakehold-test}' &&
      echo 'bucket ${LAKEHOLD_TEST_S3_BUCKET:-lakehold-test} ready'
      "
    restart: "no"

  # Somewhere for traces and metrics to go. The API emits OpenTelemetry but only enables the OTLP
  # exporter when OTEL_EXPORTER_OTLP_ENDPOINT is set, so this is inert until .env points at it —
  # which is also why nothing breaks when this service is not running.
  #
  # This replaces the trace view that came with the Aspire dashboard. It is the piece worth keeping:
  # HTTP instrumentation can say a request took 400 ms, and only a trace shows whether that was
  # DuckDB executing, a cold session attaching, or a statement queued behind another on the same
  # tenant's gate.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: lakehold-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # trace UI
      - "${OTLP_GRPC_PORT:-4317}:4317"     # OTLP/gRPC, what the API exports to
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP/HTTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
  nuget-cache:
  api-state:
  ui-node-modules:

networks:
  linq-internal:
    internal: true
